[package]
name = "raycast-linux"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
accesskit = "=0.24.1"
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
gio = "=0.18.4"
gpui = { git = "https://github.com/zed-industries/zed", rev = "e5bdd01cd819d6348ae764e69218adfee3d7edab" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e5bdd01cd819d6348ae764e69218adfee3d7edab", default-features = false, features = ["wayland", "x11"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
